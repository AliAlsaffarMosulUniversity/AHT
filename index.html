<style>
/* Layout: an explorer's graph-paper notebook — one column, each unit its own ink colour */
:root{
  --bg:#F8F2E7; --grid:rgba(123,30,43,.05); --paper:#FFFCF6; --ink:#24171A; --muted:#4F4042; --line:#E6DAC6;
  --btn:#7B1E2B; --btn-hi:#5E1520; --btn-ink:#FFFFFF; --btn-soft:#F3E3E0; --on-c:#FFFFFF;
  --u1:#2E7D3E; --u1s:#E8F1E1;  /* الجغرافية */
  --u2:#9A4A22; --u2s:#F6E6DA;  /* التاريخ */
  --u3:#1F5F9E; --u3s:#E3ECF2;  /* التربية الوطنية */
  --u4:#A66300; --u4s:#F8EAD2;  /* القوة والطاقة */
  --u5:#1F5F9E; --u5s:#E3ECF2;  /* الأرض والكون */
  --ok:#1E7A3C; --oks:#E1F1E0; --bad:#B3261E; --bads:#F8E0DC; --gold:#D99A00;
  --display:"Baloo Bhaijaan 2","Tajawal",system-ui,sans-serif;
  --body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --shadow:0 2px 0 rgba(80,40,30,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1415; --grid:rgba(255,230,210,.035); --paper:#251C1E; --ink:#F7EEE3; --muted:#D6C7BC; --line:#3F3033;
  --btn:#A8394A; --btn-hi:#C04A5C; --btn-ink:#FFFFFF; --btn-soft:#3A2227; --on-c:#1A1415;
  --u1:#7CC98A; --u1s:#22302A; --u2:#F0A070; --u2s:#3A2A22; --u3:#7FB4EA; --u3s:#1F2B38;
  --u4:#F0B460; --u4s:#382C1D; --u5:#7FB4EA; --u5s:#1F2B38;
  --ok:#6FD38E; --oks:#1E3326; --bad:#FF8A80; --bads:#3F2226; --gold:#FFC93A; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1415; --grid:rgba(255,230,210,.035); --paper:#251C1E; --ink:#F7EEE3; --muted:#D6C7BC; --line:#3F3033;
  --btn:#A8394A; --btn-hi:#C04A5C; --btn-ink:#FFFFFF; --btn-soft:#3A2227; --on-c:#1A1415;
  --u1:#7CC98A; --u1s:#22302A; --u2:#F0A070; --u2s:#3A2A22; --u3:#7FB4EA; --u3s:#1F2B38;
  --u4:#F0B460; --u4s:#382C1D; --u5:#7FB4EA; --u5s:#1F2B38;
  --ok:#6FD38E; --oks:#1E3326; --bad:#FF8A80; --bads:#3F2226; --gold:#FFC93A; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--c,var(--u5));outline-offset:3px;border-radius:14px}
h1,h2,h3{font-family:var(--display);line-height:1.25;text-wrap:balance;margin:0}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;flex:none}
.bar h1{font-size:1.3rem;flex:1;min-width:0}
.bar h1 small{display:block;font-family:var(--body);font-size:.8rem;color:var(--muted);font-weight:500;line-height:1.3}
.starpill{display:flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.starpill b{color:var(--gold)}
.back{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;padding:6px 12px;border-radius:12px;background:var(--bg);border:2px solid var(--line)}

main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}

/* home */
.hello{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:var(--shadow)}
.hello .big{font-size:2.6rem;line-height:1}
.hello h2{font-size:1.45rem}
.hello p{margin:2px 0 0;color:var(--muted);font-size:1rem}
.meter{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--u1),var(--u5),var(--u3));border-radius:99px;transition:width .5s}

.unit{display:flex;flex-direction:column;gap:10px}
.unit-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.unit-h .tag{font-family:var(--display);font-weight:800;color:var(--on-c);background:var(--c);padding:0 12px;border-radius:10px;font-size:.95rem}
.unit-h h2{font-size:1.35rem;color:var(--c)}
.chs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.chs{grid-template-columns:1fr}}
.ch{display:flex;gap:14px;align-items:center;text-align:right;background:var(--paper);border:2px solid var(--line);border-bottom:5px solid var(--c);border-radius:20px;padding:14px;transition:transform .15s}
.ch:hover{transform:translateY(-2px)}
.ch .em{flex:none;width:58px;height:58px;border-radius:18px;background:var(--cs);display:grid;place-items:center;font-size:1.9rem}
.ch .tx{min-width:0;flex:1}
.ch .no{font-size:.82rem;color:var(--c);font-weight:700}
.ch h3{font-size:1.12rem}
.stars{display:flex;gap:2px;font-size:1rem;margin-top:2px;letter-spacing:1px}
.stars .on{color:var(--gold)} .stars .off{color:var(--line)}

.challenge{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:22px;padding:18px 20px;text-align:right}
.challenge .em{font-size:2.2rem}
.challenge h3{font-size:1.25rem}
.challenge p{margin:0;opacity:.8;font-size:.95rem}
.challenge .go{margin-inline-start:auto;font-family:var(--display);font-weight:800;background:var(--gold);color:#1B1B1B;border-radius:14px;padding:6px 16px;white-space:nowrap}

/* chapter */
.hero{background:var(--c);color:var(--on-c);border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero .em{flex:none;width:72px;height:72px;border-radius:22px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:2.4rem}
.hero .no{font-size:.9rem;opacity:.9;font-weight:700}
.hero h2{font-size:1.6rem}
.hero::after{content:"";position:absolute;inset:auto -30px -50px auto;width:150px;height:150px;border-radius:50%;border:18px solid rgba(255,255,255,.12)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:4}
.tab{font-family:var(--display);font-weight:700;font-size:1.02rem;padding:8px 4px;border-radius:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.3}
.tab .ic{font-size:1.25rem}
.tab[aria-selected="true"]{background:var(--c);color:var(--on-c)}

.lesson{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lesson-h{display:flex;align-items:center;gap:10px}
.lesson-h .n{flex:none;font-family:var(--display);font-weight:800;color:var(--c);background:var(--cs);border-radius:12px;padding:0 12px;font-size:.95rem}
.lesson-h h3{font-size:1.3rem}
.idea{background:var(--cs);border-radius:16px;padding:12px 14px;font-weight:500}
.idea b.lb{display:block;font-family:var(--display);color:var(--c);font-size:.95rem}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pts li{display:flex;gap:10px;align-items:flex-start}
.pts li::before{content:"";flex:none;width:12px;height:12px;border-radius:4px;background:var(--c);margin-top:.6em;transform:rotate(45deg)}
.pts b{color:var(--c)}
.fact{border:2px dashed var(--c);border-radius:16px;padding:10px 14px;font-size:1rem}
.fact b.lb{font-family:var(--display);color:var(--c)}
.cta{display:flex;justify-content:center}
.btn{font-family:var(--display);font-weight:800;font-size:1.1rem;background:var(--c);color:var(--on-c);border-radius:16px;padding:10px 22px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--paper);color:var(--c);border:2px solid var(--c);box-shadow:none}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc-hint{color:var(--muted);font-size:.95rem;margin:0}
.fc{width:100%;max-width:440px;aspect-ratio:4/3;perspective:1200px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;gap:8px}
.front{background:var(--paper);border:3px solid var(--c);box-shadow:0 6px 0 var(--c)}
.front .w{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--c);line-height:1.3}
.front .s{color:var(--muted);font-size:.9rem}
.back-f{background:var(--c);color:var(--on-c);transform:rotateY(180deg);font-size:1.2rem;font-weight:500;line-height:1.7}
.fc-nav{display:flex;gap:10px;align-items:center}
.fc-count{font-family:var(--display);font-weight:800;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}

/* quiz */
.qbox{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qtop .sc{color:var(--c)}
.qbar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.qbar i{display:block;height:100%;background:var(--c);transition:width .3s}
.q{font-family:var(--display);font-size:1.35rem;font-weight:700;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:right;border:2px solid var(--line);border-radius:16px;padding:10px 14px;background:var(--paper);font-size:1.08rem;font-weight:500;transition:border-color .15s,background .15s}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;background:var(--cs);color:var(--c);font-family:var(--display);font-weight:800;display:grid;place-items:center}
.opt:not([disabled]):hover{border-color:var(--c)}
.opt.right{border-color:var(--ok);background:var(--oks)} .opt.right .k{background:var(--ok);color:var(--on-c)}
.opt.wrong{border-color:var(--bad);background:var(--bads)} .opt.wrong .k{background:var(--bad);color:var(--on-c)}
.opt[disabled]{cursor:default}
.fb{border-radius:16px;padding:12px 14px;font-size:1.02rem}
.fb.good{background:var(--oks)} .fb.bad{background:var(--bads)}
.fb b{font-family:var(--display);font-size:1.15rem;display:block}
.qnext{display:flex;justify-content:flex-start}

.result{text-align:center;align-items:center}
.result .big{font-size:3.4rem;line-height:1}
.result h3{font-size:1.6rem}
.result .rs{font-size:2.2rem;letter-spacing:6px}
.result .rs .on{color:var(--gold)} .result .rs .off{color:var(--line)}
.result .num{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--c);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.review{text-align:right;width:100%;display:flex;flex-direction:column;gap:8px}
.review h4{font-family:var(--display);margin:0;font-size:1.1rem}
.rv{border-inline-start:5px solid var(--bad);background:var(--bg);border-radius:12px;padding:8px 12px;font-size:1rem}
.rv .a{color:var(--ok);font-weight:700}

.foot{text-align:center;color:var(--muted);font-size:.85rem}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
/* milky + maroon theme: clear text, maroon controls */
body{font-size:19px;font-weight:500;line-height:1.85}
.pts li,.idea,.fact,.opt,.fb,.rv{color:var(--ink)}
.hello p,.fc-hint,.qtop,.foot{color:var(--muted)}
.btn{background:var(--btn);color:var(--btn-ink)}
.btn:hover{background:var(--btn-hi)}
.btn.ghost{background:var(--paper);color:var(--btn);border:2px solid var(--btn)}
.btn.ghost:hover{background:var(--btn-soft)}
.back,.themebtn{background:var(--btn);color:var(--btn-ink);border:0}
.themebtn{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem}
.tab[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.opt:not([disabled]):hover{border-color:var(--btn)}
.opt .k{background:var(--btn-soft);color:var(--btn)}
.qbar i{background:var(--btn)}
.qtop .sc,.result .num{color:var(--btn)}
.challenge{background:var(--btn);color:var(--btn-ink)}
.challenge .go{background:var(--paper);color:var(--btn)}
.hero.chal{background:var(--btn);color:var(--btn-ink)}
.meter i{background:var(--btn)}
button:focus-visible{outline-color:var(--btn)}
/* book figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fig{margin:0;background:#FFFFFF;border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:zoom-in;padding:0;text-align:right}
.fig img{display:block;width:100%;height:180px;object-fit:contain;background:#FFFFFF;padding:6px}
.fig.wide{grid-column:1/-1} .fig.wide img{height:auto;max-height:340px}
.fig figcaption{background:var(--paper);border-top:2px solid var(--line);padding:6px 12px;font-size:.95rem;color:var(--ink);font-weight:500;line-height:1.5}
.lbox{position:fixed;inset:0;z-index:30;background:rgba(20,10,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lbox img{max-width:100%;max-height:78vh;background:#FFFFFF;border-radius:14px}
.lbox p{color:#FFFFFF;font-family:var(--display);font-size:1.2rem;margin:0;text-align:center}
.lbox button{font-family:var(--display);font-weight:800;background:var(--btn);color:#FFFFFF;border-radius:14px;padding:6px 18px}
/* install */
.installcard{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px dashed var(--btn);border-radius:22px;padding:14px 18px}
.installcard .em{font-size:2.2rem;line-height:1}
.installcard h3{font-size:1.15rem}
.installcard p{margin:0;color:var(--muted);font-size:.95rem}
.installcard .btn{margin-inline-start:auto;white-space:nowrap}
@media (max-width:520px){.installcard{flex-wrap:wrap}.installcard .btn{width:100%}}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(20,10,12,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);color:var(--ink);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.sheet-in{border-radius:24px}}
.sheet h3{font-size:1.35rem}
.steps{margin:0;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:8px}
.steps .en{display:block;direction:ltr;text-align:right;font-family:system-ui,sans-serif;font-weight:700;color:var(--btn);font-size:.95rem}
.sheet details{border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.sheet summary{font-family:var(--display);font-weight:700;cursor:pointer}
.siteurl{direction:ltr;text-align:center;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px;font-family:system-ui,sans-serif;font-size:.9rem;word-break:break-all;user-select:all}
/* visitors */
.visits{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vchip{display:flex;align-items:center;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-family:var(--display);font-weight:700}
.vchip b{color:var(--btn);font-variant-numeric:tabular-nums;font-size:1.15rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.bar h1{font-size:1rem;line-height:1.2;white-space:nowrap}.back{padding:4px 9px;font-size:.92rem}.starpill{font-size:.88rem}.logo{width:36px;height:36px}.bar h1 .w1{display:none}.bar h1 small{display:none}.bar-in{gap:8px}.starpill{padding:2px 7px}.themebtn{width:38px;height:38px}}
</style>

const CH=[

lessons:[
 {t:"الموقع الجغرافي والتقسيمات الإدارية",idea:"وطننا العراق دولة عربية تقع في الجزء الجنوبي الغربي من قارة آسيا، ويحتل الجزء الشمالي الشرقي من الوطن العربي.",
  pts:["يحد العراق: **تركيا** من الشمال، و**إيران** من الشرق، و**سوريا والأردن** من الغرب، و**الخليج العربي والكويت والسعودية** من الجنوب.","**أهمية موقعه**: يقع في قلب العالم، وهو حلقة الوصل بين قارات العالم القديم: **آسيا وأفريقيا وأوروبا**.","كان العراق قديماً وحديثاً **معبراً لطرق النقل والتجارة الدولية**.","يتكون العراق من **ثماني عشرة (18) محافظة**، وكل محافظة تتكون من أقضية ونواحٍ عدة.","**المحافظة**: منطقة جغرافية من وطننا، وحدة إدارية تضم عدداً من الأقضية والنواحي والقرى، وهي **أكبر** وحدة إدارية.","**القضاء والناحية**: مناطق إدارية أصغر تتبع المحافظة، و**الناحية** أصغر وحدة في التنظيم الإداري.","تختلف المحافظات في موقعها ومساحتها وطبيعة سطحها وعدد سكانها ونشاطها الاقتصادي، فمنها في الشمال ومنها في الوسط أو الجنوب أو الغرب أو الشرق.","مساحة المحافظة وحدودها **قابلة للتغيير** بالاتساع أو التقلص وفق التقسيمات الإدارية والتطورات الحضرية."],
  fact:"رغم تنوع البيئة الجغرافية وتنوع العادات والتقاليد تبقى هويتنا واحدة: إننا مواطنون عراقيون نفخر ببلدنا ونعتز بتراثه العريق."},
 {t:"الموقع الفلكي والعراق بين الدول العربية",idea:"يحدد الجغرافيون موقع أي مكان على سطح الأرض بشبكة وهمية من خطوط الطول ودوائر العرض، وموقع العراق عليها يسمى الموقع الفلكي.",
  pts:["**خطوط الطول**: خطوط عمودية على شكل أنصاف دوائر، عددها **360** خطاً، يستفاد منها في **تحديد التوقيتات** بين الدول.","**دوائر العرض**: خطوط على شكل دوائر، عددها **180** دائرة، يستفاد منها في **تحديد نوع المناخ** بين دول العالم.","يقع العراق بين خطي طول **(38° – 48°) شرقاً**، أي أنه يقع **شرق خط كرينتش**.","ويقع بين دائرتي عرض **(29° – 37°) شمالاً**، أي أنه يقع **شمال خط الاستواء**.","**خط كرينتش**: خط الطول الرئيس الذي تُحسب منه خطوط الطول شرقاً وغرباً، وله أهمية في تحديد الوقت.","تقسم الدول العربية إلى مجموعتين: دول في **قارة آسيا** (ملونة بالأخضر على الخريطة) ودول في **قارة أفريقيا** (ملونة بالأصفر).","ينتمي العراق إلى مجموعة **الدول العربية الآسيوية**.","يطل العراق على **الخليج العربي** من خلال محافظة **البصرة**، وهو منفذه البحري من جهة الجنوب."],
  fact:"خط الاستواء هو أطول دوائر العرض، ويقسم الكرة الأرضية إلى نصفين: شمالي وجنوبي."}],

{u:0,no:"الفصل الثاني",t:"الظواهر الطبيعية للعراق",e:"⛰️",
lessons:[
 {t:"السطح (التضاريس)",idea:"لوطننا العراق امتداد كبير بين الشمال والجنوب والشرق والغرب، لذلك تنوعت ظواهر سطحه بين جبال وسهول وهضاب ووديان.",
  pts:["تقسم تضاريس العراق إلى أربعة أقسام: **المنطقة الجبلية، المنطقة المتموجة، السهل الرسوبي، الهضبة الغربية**.","**المنطقة الجبلية**: في الشمال الشرقي، تشغل **6%** من مساحة العراق، تحدها تركيا وإيران، وتمتد سلاسلها من **الشمال الغربي إلى الجنوب الشرقي**.","أعلى سلسلة جبلية فيها **حصاروست**، وأعلى قممها **هلكرد** بارتفاع **3600 م**. ومن سهولها: **سهل السندي** في دهوك، و**رانية وشهرزور** في السليمانية.","**المنطقة المتموجة**: إلى الجنوب من الجبلية، تشغل **15%**، مرتفعاتها أقل ارتفاعاً، أهمها **حمرين ومكحول وسنجار**. ومن سهولها **مخمور وأربيل**، ومن هضابها **كركوك والموصل**.","**السهل الرسوبي**: في وسط العراق وجنوبه، يشغل **24%**، أهم المناطق لانبساط سطحه وخصوبة تربته ووفرة مياهه. فيه دجلة والفرات والبحيرات والأهوار، والنفط والغاز.","**الهضبة الغربية**: في غرب العراق، **أكبر المناطق مساحة (55%)**، طابعها **صحراوي**، وفيها **الفوسفات** وصخور تدخل في **صناعة الإسمنت والزجاج**.","تنتشر **الأهوار** في الأقسام الجنوبية من السهل الرسوبي، وهي مناطق سياحية وثروة اقتصادية من **الأسماك والطيور**.","تتميز المنطقة الجبلية بالشلالات والينابيع والجداول، لذلك اختيرت **أربيل عاصمة للسياحة العربية لعام 2014م**."],
  fact:"على خريطة التضاريس: البني للمنطقة الجبلية، والبني الفاتح للمتموجة، والأخضر للسهل الرسوبي، والأصفر للهضبة الغربية."},
 {t:"المناخ والنبات الطبيعي",idea:"أدى تنوع سطح العراق وامتداده إلى اختلاف مناخه، واختلاف المناخ والتضاريس أدى إلى تنوع النبات الطبيعي.",
  pts:["**درجة الحرارة** من عناصر المناخ الرئيسة، وتكون **أكثر اعتدالاً في الصيف في المناطق الجبلية** مقارنة بالجنوب، بسبب الجبال العالية.","لذلك يسافر كثير من الناس صيفاً من الوسط والجنوب إلى **الشمال** للراحة والاستجمام.","**الأمطار** تتأثر بالتضاريس، فتزداد في **المناطق الجبلية**، ويقتصر سقوطها في العراق على **فصل الشتاء**.","الأقاليم المناخية ثلاثة: **مناخ البحر المتوسط** في الشمال، و**المناخ شبه الصحراوي (السهوب)**، و**المناخ الصحراوي الحار**.","**النبات الطبيعي**: النبات الذي ينمو **دون تدخل الإنسان** في إنباته.","**نباتات المناطق الجبلية**: غابات وأشجار، أهمها **البلوط واللوز والجوز والصنوبر**، وهي **أكثف** مناطق العراق إنباتاً لوفرة الأمطار واعتدال الحرارة.","**نباتات الحشائش القصيرة**: في المنطقة المتموجة وشرق السهل الرسوبي، وهي من أهم **مناطق الرعي**.","**نباتات ضفاف الأنهار**: قرب الأهوار والمستنقعات، أهمها **الصفصاف والقصب والبردي**.","**نباتات المنطقة الصحراوية**: في الهضبة الغربية، تتحمل الجفاف والحرارة، أهمها **الشوك والعاقول والصبار**.","**أهمية النبات الطبيعي**: يلطّف الجو، ويمنع انجراف التربة، ويدخل في الصناعات الغذائية والصناعية، ويعطي جمالاً للبيئة، ويستخدم لرعي الحيوانات."],
  fact:"غزارة الأمطار في الشمال أدت إلى تنوع النبات الطبيعي هناك من أشجار وشجيرات."},
 {t:"الموارد المائية",idea:"الماء المصدر الأساسي للحياة، وتتنوع مصادر المياه في العراق بين الأمطار والثلوج والمياه السطحية والمياه الجوفية.",
  pts:["**الأمطار والثلوج**: يقتصر سقوطها على الشتاء، وتزداد كمياتها كلما اتجهنا نحو **الشمال والشمال الشرقي**.","**المياه السطحية**: تجري على سطح الأرض، مثل الأنهار والروافد والبحيرات وشط العرب والأهوار.","**المياه الجوفية**: مخزونة في باطن الأرض، وتخرج على شكل **آبار وعيون**.","**نهر دجلة**: ينبع من جنوب شرق تركيا، ويدخل العراق عند قرية **فيشخابور**. تصب فيه روافد من الجانب الأيسر: **الخابور والزاب الكبير والزاب الصغير والعظيم وديالى**.","**نهر الفرات**: ينبع من شرق تركيا، ويدخل العراق عند مدينة **حصيبة** في القائم بمحافظة **الأنبار**، ويجري باتجاه الجنوب الشرقي.","يلتقي دجلة والفرات في **القرنة** شمال البصرة ليكوّنا **شط العرب**، وطوله **190 كم** وعرضه **2 كم**.","من البحيرات: **الثرثار والحبانية والرزازة ودوكان**، وهي مناطق لخزن المياه وسياحية جميلة.","**مشاكل المياه**: عوامل **طبيعية** (قلة الأمطار وزيادة التبخر بسبب ارتفاع الحرارة)، وعوامل **بشرية** (إنشاء الدول المجاورة السدود على الأنهار).","**الحلول**: ترشيد الاستهلاك وعدم الإسراف، وعدم رمي النفايات في الأنهار، وعدم سقي الحدائق بمياه الشرب، واستخدام الوسائل الصحيحة في الري."],
  fact:"الأهوار والمستنقعات في العراق تعد الآن من المحميات الطبيعية."}],

{u:0,no:"الفصل الثالث",t:"الظواهر البشرية والنشاط الاقتصادي",e:"🌾",
lessons:[
 {t:"السكان والزراعة والثروة الحيوانية",idea:"لا يتوزع سكان العراق بالتساوي على جميع مناطقه، بل يتركزون في السهول وضفاف الأنهار، ولا سيما السهل الرسوبي.",
  pts:["**توزيع السكان**: توزيع عدد السكان على مناطق العراق، وتؤثر فيه عوامل طبيعية وأخرى بشرية.","**زيادة الولادات والهجرة** من أهم أسباب الزيادة السكانية، فعدد السكان متغير.","يتركز السكان في **السهل الرسوبي** لانبساط أرضه وملاءمتها للزراعة ووجود المصادر المائية والثروات الاقتصادية.","**الزراعة** لها مكانة مهمة: توفر **المواد الغذائية** للسكان، و**المواد الأولية** التي تدخل في الصناعة.","أغلب أراضي العراق تصلح للزراعة إذا توافرت المياه والتربة الخصبة.","أهم المحاصيل: **القمح والشعير، الرز، الذرة، التمور، القطن، التبغ، قصب السكر، الفواكه والخضروات**.","**الثروة الحيوانية** توفر الغذاء كاللحوم والحليب والبيض، وتدخل في **الصناعات الجلدية والأسمدة**.","تتكون من **الأغنام والأبقار والماعز والجاموس والجمال وحيوانات الركوب والدواجن والأسماك**، وتنتشر في جميع المحافظات."],
  fact:"على خريطة الكثافة السكانية، تظهر بغداد أكثر المناطق كثافة بالسكان."},
 {t:"النفط والموارد المعدنية والصناعة",idea:"يحتوي وطننا العراق على موارد معدنية كثيرة تتوزع على أراضيه، أهمها النفط، ويتوافر فيه ما تحتاجه الصناعة.",
  pts:["يحتل العراق **مرتبة متقدمة** في إنتاج واحتياطي **النفط** في العالم، وتتوزع حقوله في أغلب المحافظات.","**الحقول الشمالية**: بابا كركر وباي حسن وجمبور وعين زالة وبطمة والقيارة.","**الحقول الجنوبية**: الرميلة والزبير والفكة ومجنون. **الحقول الوسطى**: الأحدب وبدرة ونفط خانة.","يدخل النفط في صناعة **تكرير النفط** للحصول على البنزين والغاز الطبيعي والنفط الأبيض وزيت الغاز.","من المصافي: **مصفى الدورة** في بغداد، و**مصفى البصرة**، و**مصفى بيجي** في صلاح الدين.","**الغاز الطبيعي**: في الحقول القريبة من النفط، ويدخل في **الصناعات الكيمياوية والبتروكيمياوية** والحياة اليومية.","**الكبريت**: يدخل في صناعة **الأسمدة والأدوية والورق**، وأهم مناطقه في **نينوى**، ويعد **حقل المشراق** أهم حقوله.","**الفوسفات**: يدخل في صناعة **الأسمدة الفوسفاتية**، وأهم مناطق إنتاجه في الهضبة الغربية في **عكاشات**.","معادن أخرى: **الحديد والنحاس والزئبق**.","**الصناعة**: يتوافر في العراق المواد الأولية والأيدي العاملة ورأس المال، ومن صناعاته: **الغذائية، الإنشائية، المعدنية، الكيمياوية، الغزل والنسيج**، والكهربائية والدوائية."],
  fact:"يصدّر العراق منتجاته النفطية عن طريق البحر إلى أغلب دول العالم."},
 {t:"وسائل النقل والسياحة",idea:"يضم العراق طرق نقل كثيرة تنتشر في جميع محافظاته، تقسم إلى برية ومائية وجوية، وتنوعت فيه المواقع السياحية والتاريخية والدينية.",
  pts:["نستخدم **السيارات والقطارات** في المسافات القصيرة، و**الطائرات والبواخر** في المسافات الطويلة.","**الطرق البرية**: طرق السيارات والسكك الحديد، تخدم جميع المدن والقرى.","**الطرق المائية الداخلية**: الطرق النهرية في دجلة والفرات وشط العرب.","**الطرق المائية الخارجية**: الطرق البحرية، ولها أهمية كبيرة في التجارة، إذ يصدر عبرها العراق النفط ويستورد البضائع.","يمتلك العراق **أسطولاً تجارياً** من البواخر وناقلات النفط، و**موانئ** على الخليج العربي: **أم قصر والمعقل والبصرة**.","**الطرق الجوية**: من المطارات: **بغداد وأربيل والبصرة والنجف الأشرف**، وسيتم إنشاء مطارات أخرى.","**السياحة**: تنتشر الآثار التاريخية في **بغداد وصلاح الدين ونينوى وأربيل وبابل وذي قار وواسط**.","**المصايف**: مصيف **صلاح الدين وسولاف وبيخال وشقلاوة**، ومراكز للاستجمام في **دوكان والحبانية**.","**السياحة الدينية**: زيارة المواقع الدينية والعتبات المقدسة في **النجف الأشرف وكربلاء المقدسة وبغداد وسامراء**."],
  fact:"أصبحت السياحة الدينية في العراق مورداً اقتصادياً مهماً بعد النفط."}],
vocab:[["توزيع السكان","توزيع عدد السكان على مناطق العراق"],["الزيادة السكانية","من أسبابها زيادة الولادات والهجرة"],["الزراعة","توفر الغذاء والمواد الأولية للصناعة"],["الثروة الحيوانية","أغنام وأبقار ودواجن وأسماك وغيرها"],["تكرير النفط","صناعة للحصول على البنزين والنفط الأبيض"],["الكبريت","معدن للأسمدة والأدوية، أهم حقوله المشراق"],["الفوسفات","معدن للأسمدة الفوسفاتية، يُنتج في عكاشات"],["النقل المائي الداخلي","النقل في الأنهار: دجلة والفرات وشط العرب"],["النقل المائي الخارجي","النقل البحري للتجارة وتصدير النفط"],["السياحة الدينية","زيارة المراقد والعتبات المقدسة"]],

lessons:[
 {t:"بلاد الرافدين وأول كتابة في التاريخ",idea:"عُرف وطننا العراق عبر عصوره بأسماء عديدة، وأغرت أرضه الخصبة الإنسان بالاستقرار فيه منذ أقدم الأزمان، فأنتج حضارات عديدة حتى وقتنا الحاضر.",
  pts:["من أسماء العراق: **بلاد الرافدين**، و**أرض بابل**، و**بلاد ما بين النهرين**، وفي العصور الإسلامية عُرف بـ**أرض السواد** لكثافة زراعته وكثرة خضرته.","أُطلقت تسمية **بلاد سومر** على الجزء الجنوبي، و**سومر وأكد** على الوسط والجنوب، و**بلاد آشور** على الجزء الشمالي.","ارتبطت تسمية العراق بنهري **دجلة والفرات** الخالدين، حتى قيل إن بلادنا **هبة الرافدين**.","من حضاراته: **السومرية والأكدية والبابلية والآشورية** ثم **الإسلامية**.","**العراقيون أول من اخترع الكتابة**، وظهرت بداياتها في **المعابد** لتدوين وارداتها وأملاكها.","لم يكن الورق معروفاً، فكتب العراقي القديم على ألواح صغيرة من **الطين الطري** تسمى **الرُّقُم الطينية**، بقلم **مثلث الرأس**.","سُميت **الكتابة المسمارية** لأن نهايات حروفها تشبه **رؤوس المسامير**.","ابتكر العراقيون **الأختام الأسطوانية**: أسطوانة من الحجر طولها بين **2 – 3.5 سم**، منقوشة بصورة **معكوسة**، إذا دُحرجت على الطين الطري تركت الصورة الأصلية.","يحفر على الختم مناظر للآلهة أو البشر أو الحيوانات، وقد يكتب عليه **اسم صاحبه وألقابه**، ويعلق بخيط حول الرقبة أو المعصم، واستخدمه بعضهم **حلياً**."],
  fact:"من آثار حضاراتنا: القيثارة السومرية، وتمثال الملك سرجون الأكدي، وبرج بابل، والثور المجنح الآشوري."},
 {t:"مهد القوانين والديانات والمعابد",idea:"تتصف حضارة بلاد الرافدين بصفات عظيمة أبرزها الشرائع والقوانين، وبلادنا من أقدم البلدان التي ظهرت فيها الديانات وأنشئت فيها المعابد.",
  pts:["تعد شرائع العراقيين من **أقدم الشرائع** في التاريخ، وشملت نواحي الحياة **الاقتصادية والسياسية والاجتماعية والدينية**.","أكدت الشرائع على: **مجتمع منظم يسوده النظام والقانون**، و**احترام الطقوس الدينية**، و**العدالة وحماية الضعفاء واحترام المرأة والطفولة**.","أشهرها **شريعة الملك البابلي حمورابي**: لنشر العدل ومكافحة الفساد والغش، ومنع القوي من **اضطهاد الضعيف**.","عاقبت من يسرق أموال المعابد أو المال العام بغرامات تصل إلى **ثلاثين ضعفاً** من قيمة المسروق.","نُقشت على **مسلة من الحجر الأسود** باللغة البابلية والخط المسماري، وتتألف من **282 مادة** قانونية.","في أعلى المسلة نحت يمثل حمورابي واقفاً أمام **إله الشمس (شمش)** وهو **إله العدالة**، يتقبل منه الشرائع.","كان لكل مدينة سومرية **معبد خاص**، يقام على أماكن مرتفعة تسمى **الزقورات** لحمايتها من **الفيضانات**، يُصعد إليها بسلالم من الطابوق.","للمعابد نوعان: **الكبيرة (معابد الدولة)** وفيها عدد كبير من الكهنة والعمال، و**الصغيرة** لعبادة إله واحد. وتذكر المصادر وجود **153 معبداً** في بابل.","لم تكن المعابد للعبادة فقط: كانت تمتلك **أراضي زراعية** واسعة، و**محلات للصناعات اليدوية** كالحياكة وطحن الحبوب، وكانت **مراكز للعمل والتعليم (المدارس)**.","**المندي**: بيت العبادة لطائفة **الصابئة المندائيين**، من القصب والطين على ضفاف الأنهار، والمندائية من **أقدم الديانات التوحيدية** في جنوب العراق."],
  fact:"يضمن الدستور العراقي في المادة (2) الحقوق الدينية لجميع الأفراد في حرية العقيدة، كالمسيحيين والإيزيديين والصابئة المندائيين."}],

{u:1,no:"الفصل الثاني",t:"العراق حاضرة الخلافة الإسلامية",e:"🕌",
lessons:[
 {t:"الكوفة عاصمة الخلافة الإسلامية (36 – 41 هـ)",idea:"الكوفة من الأمصار (المدن) الإسلامية التي أسسها العرب خارج الجزيرة العربية، واتخذها الإمام علي بن أبي طالب (عليه السلام) عاصمة لخلافته.",
  pts:["أصبح العراق مقراً للخلافة مرتين: الأولى في خلافة **الإمام علي (ع)** بالكوفة، والثانية في خلافة **العباسيين** ببغداد وسامراء.","بُنيت الكوفة سنة **17 هـ** على يد القائد **سعد بن أبي وقاص**.","**تسميتها**: من صفات تربتها، فكل رمل خالطه حصى يسمى **كوفة**، أو نسبة إلى مرتفع صغير يسمى **كوفان**، أو لاستدارتها أو لاجتماع الناس بها.","**موقعها**: إلى الغرب من نهر الفرات، قرب مدينة **الحيرة** عاصمة دولة **المناذرة**، على طرف الصحراء لتأمين طرق المواصلات.","اختير موقعها لتوافر **الظروف الصحية والمناخية الجيدة** والمياه الصالحة للشرب من نهر الفرات القريب.","خُصص لكل قبيلة محلة خاصة سميت **الخطط**، وبنوا **المسجد الجامع ودار الإمارة وبيت المال والأسواق**.","ازدهرت بعد أن اتخذها **الإمام علي (ع)** عاصمة لخلافته سنة **36 هـ**، وكان يدير الدولة من جامعها الكبير.","نشأت فيها مدرسة للنحو العربي عُرفت بـ**مدرسة الكوفة**، وباسمها سمي **الخط الكوفي**.","أنجبت العلماء والمحدثين والفقهاء والشعراء، منهم **الشيخ المفيد والشيخ الطوسي والشريف المرتضى**، وتقع على **طريق الحج** إلى مكة المكرمة."],
  fact:"من معالم الكوفة: مسجد الكوفة، ومرقد هاني بن عروة (رضي الله عنه)، وبقايا دار الإمارة."},
 {t:"بغداد حاضرة الخلافة العباسية",idea:"أصبح العراق مقراً للخلافة مرة أخرى في زمن العباسيين حين اتخذوا بغداد عاصمة لهم، فهي أم الدنيا وسيدة البلاد ومدينة السلام.",
  pts:["**أسباب اختيار بغداد**: موقعها وسط العراق على **نهر دجلة** الذي وفّر المياه للشرب والزراعة، وموقعها عند **ملتقى الطرق التجارية**، و**تأمين مكان جديد للجند**، و**اعتدال ظروفها المناخية**.","**تسميتها**: أرجعها بعض الباحثين إلى أصل **بابلي أو آرامي**، وسميت **مدينة السلام ودار السلام** (والسلام اسم لنهر دجلة).","سميت **المدينة المدورة** لشكلها **الدائري**، وأحيطت بسورين خارجي وداخلي، وهي أول مدينة عربية إسلامية بهذا الشكل لعوامل سياسية وعسكرية.","**أبوابها الأربعة**: باب **الكوفة**، وباب **البصرة**، وباب **خراسان**، وباب **الشام**.","**بانيها**: الخليفة **المنصور**، باشر بناءها سنة **145 هـ** على **الجانب الغربي** لنهر دجلة، وانتهى من السور الخارجي سنة **149 هـ**.","تطورت بسرعة، فنقل المنصور الأسواق إلى **الكرخ** سنة **157 هـ**، وبنى قصراً خاصاً به سماه **قصر الخلد**.","**الرصافة**: على **الجانب الشرقي**، اتخذها **المهدي** بن المنصور معسكراً لجنده سنة **152 هـ**، ثم صارت حافلة بالمدارس والأسواق والقصور.","كان **سوق الثلاثاء** من أعظم أسواقها، يعقد أول يوم ثلاثاء من كل شهر، و**المدرسة المستنصرية** من أشهر مدارسها.","تضم مرقد **الإمامين الجوادين (الكاظمين) (ع)** في الكاظمية، ومرقد **الإمام الأعظم أبي حنيفة النعمان** في الأعظمية."],
  fact:"لإرثها الحضاري العظيم اختيرت بغداد عاصمة للثقافة العربية لسنة 2013م."},
 {t:"سامراء عاصمة أخرى للخلافة العباسية",idea:"اتخذ الخليفة المعتصم العباسي مدينة سامراء سنة 221 هـ عاصمة له ومقراً لجنده، فبنى فيها القصور والدور والمساجد.",
  pts:["جلب المعتصم **البنائين والفنانين** الماهرين، واشترى **الأشجار المثمرة** من جميع البلدان، مما يؤكد أهمية **التشجير** في الحفاظ على البيئة.","استمر بناؤها من **سنتين إلى ثلاث سنوات**، وأقيمت فيها المساجد ودواوين الدولة والأسواق والشوارع.","**موقعها**: في منطقة تسمى **القاطول** نسبة إلى نهر يحمل الاسم نفسه يتفرع من دجلة، وآثارها تعود إلى **ما قبل التاريخ**.","**تسميتها**: سامرا، وسومرا، و**سُرَّ من رأى**، وأخيراً سامراء. وقيل إن المعتصم **سُرَّ هو وجنده برؤيتها** بعد اكتمال بنائها.","تعد سنة **223 هـ** بداية حياتها كعاصمة، وقسّم المعتصم أحياءها وسمى كل واحد منها **القطيعة**.","من أشهر شوارعها **شارع الخليج** بمحاذاة دجلة، حيث تفرغ السفن القادمة من بغداد والبصرة وواسط والموصل بضائعها، وأقام **جسراً** بين جانبيها.","من قصورها: **الجوسق والعاشق والمعشوق**. ومن جوامعها **الجامع الكبير** ومئذنته **الملوية**.","**الملوية**: مخروطية الشكل على قاعدة مربعة، من **خمسة أدوار**، يُصعد إلى قمتها **بعكس دوران الساعة**، ارتفاعها **52 متراً**، ويرجح أنها بنيت على هيئة **الزقورات**.","بقيت عاصمة نحو **58 عاماً**، حكم خلالها **ثمانية** خلفاء، آخرهم **المعتمد على الله** الذي عاد إلى بغداد سنة **279 هـ**.","تضم ضريح **الإمامين العسكريين (ع)**: الإمام **علي الهادي** (ت 254 هـ) والإمام **الحسن العسكري** (ت 260 هـ)، وعليهما **أكبر قبة** في العالم الإسلامي."],
  fact:"يشير بناء قصور سامراء وجوامعها والملوية إلى مهارة البنائين والمعماريين العراقيين في الهندسة المعمارية وتخطيط المدن."}],

{u:1,no:"الفصل الثالث",t:"العراق.. موطن العلم والعلماء",e:"📜",
lessons:[
 {t:"المدرسة النظامية والمدرسة المستنصرية",idea:"اهتم أجدادنا العراقيون القدماء بالعلم كثيراً، واستمروا بتطوير علومهم في الفترة الإسلامية، فضمّت المدن الرئيسة المدارس ومراكز البحث العلمي.",
  pts:["تشير آثارهم إلى اهتمامهم بـ**الحساب والهندسة والطب والفلك**، وتطور ذلك حين أصبح العراق مركزاً للخلافة الإسلامية.","تذكر المصادر وجود **أكثر من ثلاثين مدرسة** ببغداد، أشهرها **النظامية والمستنصرية**.","**المدرسة النظامية**: أخذت اسمها من مؤسسها الوزير السلجوقي **نظام الملك الطوسي**، ومن أولى المدارس في بغداد والعالم، اكتمل بناؤها سنة **459 هـ**.","احتوت على **مساكن للطلاب والأساتذة**، وعُيّن لها مدراء يسمون **النظّار**، وكانت الدراسة على شكل **حلقات** يرأس كل حلقة أحد الفقهاء.","درّست علوم **القرآن والحديث والفقه وعلم الكلام والنحو**، وكان الطلاب يسكنون ويتناولون الطعام **مجاناً**، وضمت خزانتها **ستة آلاف مجلد**.","**المدرسة المستنصرية**: نسبة إلى الخليفة العباسي **المستنصر بالله** الذي بناها سنة **631 هـ**، وما زالت بنايتها قائمة حتى اليوم.","تعد **أول جامعة إسلامية متخصصة** في العالم بمفهوم الجامعة الحديث، وضمت **أربع دور (كليات)**: دار القرآن الكريم، ودار السنة النبوية الشريفة، ودار الفقه، ودار الطب.","تميزت بأمرين: **دفع الرواتب** للطلاب والمدرسين والموظفين (وتضاعف في رمضان)، و**تأسيس حمام** للاغتسال، دليلاً على الاهتمام بالنظافة الشخصية.","لم يتجاوز عدد طلابها **ثلاثمائة** طالب، وضمت **مستشفى تعليمياً** يعالج المرضى مجاناً، وخزانة أهدى إليها المستنصر **ثمانين ألف كتاب**، ومساكن للطلبة (**الأقسام الداخلية**)."],
  fact:"«النظافة من الإيمان»، لذلك أسست المستنصرية حماماً لخدمة جميع الطلاب والعاملين، وهو عمل لم يسبقه مثيل."},
 {t:"بيت الحكمة ودور العلم",idea:"بيت الحكمة من أهم المؤسسات العلمية والثقافية التي تأسست في بغداد منذ أن شيدها الخليفة أبو جعفر المنصور سنة 145 هـ.",
  pts:["بدأ **خزانة** للكتب الفلسفية والطبية وعلوم الهندسة والفلك وغيرها.","تطور في زمن الخليفة **هارون الرشيد** ليصبح مؤسسة للبحث العلمي والتأليف والترجمة، يضم **مترجمين ونساخين ومجلدين** وحفظة للكتب.","من أشهر المترجمين **يوحنا بن ماسويه** وكان **مسيحياً**، مما يؤكد **التعايش السلمي** بين الأديان، وأشرف على ترجمة **الكتب الطبية** إلى العربية.","و**الفضل بن نوبخت** أشرف على ترجمة الكتب من **الفارسية** إلى العربية.","في خلافة **المأمون** تحولت الخزانة إلى مركز للبحث العلمي والترجمة والتأليف، وسمي **بيت الحكمة**.","يقع بيت الحكمة على جانب **الرصافة** قرب **جسر باب المعظم**، وصار مثالاً يحتذى به، كـ**دار الحكمة** التي أسسها **الفاطميون بالقاهرة**.","**دور العلم**: أسس **جعفر بن حمدان** في **الموصل** داراً للعلم سنة **333 هـ** وجعلها وقفاً لطلبة العلم.","وأنشأ **أبو علي بن سوار** في **البصرة** داراً للعلم سنة **372 هـ** للقراءة والبحث.","وأسس الوزير **سابور بن أردشير** سنة **383 هـ** داراً للعلم في **الكرخ** ببغداد، ضمّت أكثر من **عشرة آلاف كتاب**، وكانت تجري فيها **مناظرات** العلماء والأدباء والشعراء."],
  fact:"ضمت دار علم سابور نسخاً من القرآن الكريم بخط أشهر الخطاطين العراقيين المعروفين آنذاك."},
 {t:"علماء عراقيون",idea:"شهد تاريخ العراق ظهور الكثير من العلماء والمفكرين والأدباء والشعراء الذين أسهموا في رفد الحضارة العربية والإسلامية والإنسانية.",
  pts:["**أبو الأسود الدؤلي**: ظالم بن عمرو الكناني، **أول من وضع قواعد النحو العربي** بالبصرة بعد أن رسم له الإمام علي (ع) أصوله، و**أول من نقّط المصحف**، توفي سنة **69 هـ**.","**جابر بن حيان الكوفي**: **واضع علم الكيمياء**، تتلمذ على يد **الإمام جعفر الصادق (ع)**، واعتمد **المنهج التجريبي**، ومن كتبه **الميزان** و**الإيضاح**، توفي بحدود سنة **200 هـ**.","من إنجازات جابر: **طلاء يمنع صدأ الحديد**، و**ورق غير قابل للاحتراق**، و**صبغ الجلود والشعر** واستخدام الشب لتثبيت الألوان.","**أبو إسحاق الصابي**: من **الصابئة المندائيين**، ولد في بغداد واشتغل بالطب والهندسة والفلك، ومن كتبه **رسالة في الإسطرلاب**، توفي سنة **335 هـ**.","**المسعودي**: مؤرخ ورحالة ولد ببغداد، من كتبه **مروج الذهب ومعادن الجوهر** و**التنبيه والإشراف**، توفي سنة **346 هـ**.","**الحسن بن الهيثم البصري**: درس المرايا وامتزاج الألوان، ومن كتبه **المناظر** في علم الضوء والبصريات، وتحدث عن **تشريح العين** و**قوس قزح**، توفي سنة **430 هـ**.","**شهدة بنت الأبري البغدادية**: الملقبة بـ**فخر النساء**، من أشهر **راويات الحديث**، ومن النساء المعروفات بجودة الخط العربي، توفيت ببغداد سنة **574 هـ**.","**شعراء**: **محمد مهدي الجواهري** (شاعر العرب الأكبر)، و**بدر شاكر السياب**، و**نازك الملائكة**، و**سركون بولص**، و**عبد الله كوران**، و**مصطفى جمال الدين**.","**د. عبد الجبار عبد الله**: من الصابئة المندائيين، **سفير العراق العلمي**، من أشهر علماء **الفيزياء والأنواء الجوية**، و**أول رئيس لجامعة بغداد** بعد ثورة 14 تموز 1958م.","ومن علمائنا: الأب **أنستاس الكرملي** (اللغة العربية)، و**مصطفى جواد** (مؤرخ ولغوي)، و**كمال السامرائي** (طبيب)، و**محمد أمين زكي** (مؤرخ)، و**علي الوردي** (عالم اجتماع)، و**حسين علي محفوظ**، والمعمارية **زها حديد**.","**جواد سليم** (1921 – 1961م): من أشهر النحاتين، أسس **جماعة الفن الحديث**، وشيّد **نصب الحرية** في ساحة التحرير ببغداد، ويمثل كفاح الشعب العراقي من أجل الحرية."],
  fact:"يقول الجواهري في حب وطنه: «حَيِيتُ سَفْحَكِ عن بعدٍ فحَيِّيني... يا دجلةَ الخيرِ يا أمَّ البساتينِ»."}],

{u:2,no:"الفصل الأول",t:"مجتمعنا العراقي",e:"🤝",
lessons:[
 {t:"مفهوم المجتمع ومجتمعنا العراقي",idea:"المجتمع مجموعة من الأفراد يعيشون على أرض معينة تربطهم روابط عدة أهمها الوطن، والأسرة إحدى نواة أي مجتمع.",
  pts:["**الروابط المشتركة** التي تجمع أبناء المجتمع العراقي: **الوطن، والمصير المشترك، والأهداف المشتركة، والحضارة والمصالح المشتركة**.","**مجتمعنا العراقي** متميز عن غيره، له عادات وتقاليد وقيم مدنية مشتركة، وعاش أبناؤه **متحابين** فيما بينهم من الشمال إلى الجنوب.","يجمع أبناء العراق **وطن واحد**، دون تمييز من حيث **العرق أو القومية أو الديانة**.","لكل فرد من أبناء وطننا **الحق في ممارسة عاداته ومعتقداته وديانته**، ونرفض المفاهيم التي تعمل على تفرقة أبناء الوطن.","**مكونات المجتمع العراقي**: **العرب، الكرد، التركمان، الكلدان، الآشوريون، السريان، الأرمن، الإيزيديون، الشبك، الصابئة**.","لكل مكون **حقوق**، وعليه **واجبات** تجاه الوطن والمجتمع تتمثل بـ**الانتماء والتعاون والولاء**.","يؤمن أفراد مجتمعنا على تعدد مكوناته بجميع الحقوق والواجبات التي تجمعهم على **حب الوطن**، وأهمها **المساواة والتعاون والعدالة والتضحية**.","**التنوع** بين مكونات المجتمع العراقي من ميزات **التكامل والتعايش السلمي** بين جميع مكوناته."],
  fact:"الانتماء للوطن والاعتزاز به قيمة يجب غرسها في الإنسان منذ صغره ليخدم بلده ويعمل على النهوض به."},
 {t:"الأسرة جزء من المجتمع",idea:"الأسرة إحدى مكونات المجتمع الأساسية، وتتكون من الأب والأم والأبناء، وأحياناً تضم الجد والجدة وغيرهم.",
  pts:["تتميز الأسرة بـ**علاقات مترابطة** بين أفرادها.","كلما كانت هذه العلاقات **قوية ومتماسكة** زاد ترابط الأسرة وتماسكها، وهذا يؤدي إلى **تماسك المجتمع** الذي تنتمي إليه.","لكل فرد في الأسرة **وظيفة أو عمل** يقوم به: الأب والأم والأخ والأخت.","نتعلم روح **الانتماء والولاء** للوطن، و**المساواة** بين أفراد المجتمع الواحد، و**عدم التمييز** فيما بينهم.","يلتزم كل فرد بـ**حقوقه وواجباته**.","**أتعاون** مع زملائي في الحفاظ على النظام في المدرسة والشارع.","**أساعد** جيراني وأقاربي، و**أزور** المرضى في المستشفى.","**أشارك** أصدقائي في أفراحهم وأحزانهم.","**أحترم** حقوق الآخرين ولا أعتدي عليهم."],
  fact:"قال الإمام علي (عليه السلام): «الناس صنفان: إما أخ لك في الدين، وإما نظير لك في الخلق»."}],
vocab:[["المجتمع","أفراد يعيشون على أرض معينة تربطهم روابط أهمها الوطن"],["الروابط المشتركة","الوطن والمصير والأهداف والحضارة والمصالح"],["المصير المشترك","مستقبل واحد يجمع أبناء الوطن"],["مكونات المجتمع","العرب والكرد والتركمان والكلدان وغيرهم"],["التعايش السلمي","عيش المكونات معاً بمحبة وسلام"],["الأسرة","الأب والأم والأبناء، نواة المجتمع"],["الانتماء","الشعور بأنك جزء من الوطن والمجتمع"],["الولاء","الإخلاص للوطن والدفاع عنه"],["المساواة","لا تمييز بين أفراد المجتمع الواحد"]],

 ["عدد مكونات المجتمع العراقي في الشكل:",["عشرة","خمسة","ثلاثة","عشرون"],"العرب، الكرد، التركمان، الكلدان، الآشوريون، السريان، الأرمن، الإيزيديون، الشبك، الصابئة."],
 ["واجبات كل مكون تجاه الوطن والمجتمع تتمثل بـ:",["الانتماء والتعاون والولاء","الأنانية","التفرقة","الإهمال"],"ولكل مكون حقوق أيضاً."],
 ["أهم الحقوق والواجبات التي تجمع أفراد المجتمع العراقي:",["المساواة والتعاون والعدالة والتضحية","الظلم","التمييز","العنف"],"تجمعهم على حب الوطن."],
 ["التنوع بين مكونات المجتمع العراقي يعد من ميزات:",["التكامل والتعايش السلمي","الخلاف","الضعف","التفرقة"],"التنوع مصدر قوة."],
 ["حب الوطن من أهم القواسم المشتركة بين أبناء المجتمع العراقي.",TF,"من أسئلة الوحدة."],

 ["من السلوك الحسن مع الجيران والأقارب:",["مساعدتهم وزيارة المرضى منهم","الاعتداء عليهم","إزعاجهم","عدم السؤال عنهم"],"من مجموعة نشاطات تعزز القيم."],

 ["احترام حقوق الآخرين وعدم الاعتداء عليهم:",["قيمة مدنية مهمة","سلوك خاطئ","أمر غير مهم","ضعف"],"من قيم مجتمعنا."],
 ["قال الإمام علي (ع): «الناس صنفان: إما أخ لك في الدين وإما...»:",["نظير لك في الخلق","عدو لك","غريب عنك","بعيد عنك"],"دليل على المساواة ونبذ التمييز."],

 ["من القيم المدنية في الوحدة الثالثة:",["الانتماء للوطن والتعاون والمساواة","الأنانية","التعصب","الإهمال"],"وقبول التنوع والإحساس بالمسؤولية."],

{u:2,no:"الفصل الثاني",t:"دولتنا بين الحقوق والواجبات",e:"⚖️",
lessons:[
 {t:"مفهوم الدولة ورموزها وسلطاتها",idea:"الدولة مجموعة من المؤسسات السياسية والاجتماعية والاقتصادية والقضائية ذات علاقات منظمة ومترابطة، تجمعها خدمة الوطن وأفراد مجتمعه.",
  pts:["**أركان الدولة** أربعة: **الوطن، والشعب، والسلطات الاتحادية، والسيادة**.","لكل دولة اسم وشعار: اسم دولتنا **جمهورية العراق**، وشعارنا **النسر**.","**العلم**: لكل إنسان وطن ولكل وطن علم يرمز إلى **سيادته**، لذا نقف إجلالاً واحتراماً عند رفع علمنا العراقي.","**النشيد الوطني**: لكل دولة نشيدها الوطني، لذا نقف جميعاً إجلالاً واحتراماً عند الاستماع إليه.","العراق **دولة اتحادية ديمقراطية مستقلة ذات سيادة**، نظام الحكم فيها **جمهوري نيابي (برلماني) ديمقراطي اتحادي**.","**السلطة التشريعية**: مهمتها **سن القوانين** والأنظمة التي تنظم الحياة العامة، ويمثلها **مجلس النواب**.","**السلطة التنفيذية**: مهمتها **تنفيذ القوانين** التي تسنها السلطة التشريعية، ويمثلها **مجلس الوزراء**.","**السلطة القضائية**: تتميز بـ**الاستقلال التام**، مهمتها **تحقيق العدالة** بإصدار الأحكام وفق القانون، ويمثلها **مجلس القضاء الأعلى**.","تكون أنظمة الحكم للدول على أشكال منها: **النظام الجمهوري (البرلماني)** و**النظام الملكي**."],
  fact:"من حق كل مواطن أن يعيش في ظل حكومة ديمقراطية ينتخبها المواطنون بحرية، توفر له الأمن والرفاهية والعدالة والمساواة."},
 {t:"المواطنة وحقوق المواطن",idea:"المواطن هو الشخص الذي يعيش على أرض الدولة ويحمل جنسيتها، والمواطن الصالح هو الذي يحترم الأنظمة والقوانين والدستور.",
  pts:["**المواطن الصالح**: عضو فعّال في بناء الدولة، له حقوق وامتيازات يكفلها له الدستور وعليه واجبات، ويسهم في تطوير وطنه بخدمته بإخلاص، ويحرص على احترام حقوق الآخرين.","**صفات المواطن الصالح**: يتفهم طبيعة قدراته وإمكاناته وواجباته وحقوقه، ويشارك في معالجة مشكلات مجتمعه، ويقدر مكانة وطنه في العالم، ويحترم حقوق الآخرين، ومتفوق ومخلص في واجباته.","**المواطنة**: صفة المواطن الذي يتمتع بالحقوق ويلتزم بالواجبات التي يفرضها عليه انتماؤه لوطنه، وهي مشتقة من **الوطن** محل الإقامة والحماية.","**1. التربية والتعليم**: تحرص دولتنا على تقديمها **مجاناً** لأبنائها التلاميذ والطلبة عبر **وزارتي التربية والتعليم العالي والبحث العلمي**.","**2. الخدمات الصحية**: تقدمها الدولة **مجاناً** عبر مؤسسات وزارة الصحة كالمستشفيات والمستوصفات ومراكز الرعاية الصحية.","**3. الأمن**: عبر الأجهزة الأمنية المتمثلة بـ**الجيش والشرطة** في **وزارتي الدفاع والداخلية**، و**الحشد الشعبي** الذي تشكّل بناءً على **فتوى الدفاع الكفائي**.","**4. خدمات أخرى**: النقل والمواصلات، والخدمات الاقتصادية والاجتماعية، والدعم والرعاية لـ**المسنين والأيتام والأرامل** من خلال **وزارة العمل والشؤون الاجتماعية**، وخدمات الإسكان والكهرباء والمالية والتجارة وغيرها."],
  fact:"المادة (20) من دستور جمهورية العراق: للمواطنين رجالاً ونساءً حق المشاركة في الشؤون العامة والتمتع بالحقوق السياسية، بما فيها حق التصويت والانتخاب والترشيح."},
 {t:"واجبات المواطن والحفاظ على البيئة",idea:"كما يتمتع المواطن بحقوقه، فإن عليه واجبات تجاه وطنه: حبه والتضحية في سبيله، والالتزام بالقوانين، والمحافظة على الممتلكات العامة والبيئة.",
  pts:["**1. حب الوطن والتضحية في سبيله**: كلنا نحب الوطن الذي نعيش على أرضه وتحت سمائه، وجميعنا يعمل من أجل حماية الوطن ورفعته.","**2. الالتزام بالأنظمة والقوانين**: لتنظيم حياة المجتمع وحمايته وتحقيق العدالة والمساواة، وهناك **علاقة قوية** بين الالتزام بالأنظمة وتقدم الشعوب.","على كل واحد منا، طالباً أو معلماً أو مسؤولاً، أن يطبق النظام **بأمانة وإخلاص**، وأن نتصرف بمسؤولية وفقاً لقوانين وطننا.","**3. المحافظة على الممتلكات العامة** لأنها **ملك لجميع أفراد المجتمع**: عدم العبث بالأثاث المدرسي، والترشيد في استهلاك الماء والكهرباء، والحفاظ على الحدائق العامة والمتنزهات.","**4. الحفاظ على البيئة**: البيئة هي المكان الذي يعيش فيه الإنسان، وتشمل الأرض وما حولها من **ماء وهواء وتراب ومخلوقات حية**.","يهدد البيئة النمو السكاني المتزايد والتطور الزراعي والصناعي وعدم الالتزام بالأنظمة، ومن مخاطرها: **تلوث المياه، تلوث الهواء، تلوث التربة**.","تراكم المخلفات والنفايات بأنواعها يشكل خطراً كبيراً على الإنسان والكائنات الحية، يتمثل بانتشار **الأمراض والأوبئة**.","**لكل حق واجب**: الغذاء ← عادات صحية في الأكل، الحماية والأمان ← الالتزام بالقوانين، التعلم ← الاجتهاد والمحافظة على المدرسة، العيش في بيئة نظيفة ← المحافظة عليها من التلوث، العمل ← الإخلاص فيه."],
  fact:"العيش في بيئة سليمة حق لكل مواطن، والمحافظة عليها واجب على كل مواطن."}],

   <article class="lesson pop"><div class="lesson-h"><span class="n">الدرس ${["الأول","الثاني","الثالث"][k]}</span><h3>${l.t}</h3></div>
   <div class="idea"><b class="lb">💡 الفكرة الرئيسة</b>${l.idea}</div>
   ${(FIGS[(i+1)+"abc"[k]]||[]).length?`<div class="figs">${FIGS[(i+1)+"abc"[k]].map(f=>`<button class="fig${WIDE.has(f[0])?" wide":""}" data-src="img/${f[0]}" data-cap="${f[1]}"><img src="img/${f[0]}" alt="${f[1]}" loading="lazy"><figcaption>${f[1]}</figcaption></button>`).join("")}</div>`:""}
   <ul class="pts">${l.pts.map(p=>`<li><span>${md(p)}</span></li>`).join("")}</ul>
   <div class="fact"><b class="lb">🤩 هل تعلم؟ </b>${l.fact}</div></article>`).join("")+
   `<div class="cta row"><button class="btn ghost" id="toFc">🃏 راجع الكلمات</button><button class="btn" id="toQ">✏️ اختبر نفسك</button></div></div>`;
  pane().querySelectorAll(".fig").forEach(b=>b.onclick=()=>zoom(b.dataset.src,b.dataset.cap));
  document.getElementById("toFc").onclick=()=>chapter(i,"fc");
  document.getElementById("toQ").onclick=()=>chapter(i,"quiz");
}

function zoom(src,cap){
  const d=document.createElement("div");d.className="lbox";d.setAttribute("role","dialog");
  d.innerHTML=`<img src="${src}" alt="${cap}"><p>${cap}</p><button>✕ إغلاق</button>`;
  d.onclick=()=>d.remove();document.body.appendChild(d);d.querySelector("button").focus();
}
function cards(i){
  const v=CH[i].vocab;let k=0;
  pane().innerHTML=`<div class="fc-wrap"><p class="fc-hint">اقرأ الكلمة وتذكّر معناها، ثم اضغط على البطاقة لتقلبها.</p>
   <button class="fc" id="fc" aria-label="اقلب البطاقة"><div class="fc-in"><div class="face front"><span class="w" id="fw"></span><span class="s">اضغط لترى المعنى</span></div><div class="face back-f" id="fb"></div></div></button>
   <div class="fc-nav"><button class="btn ghost" id="pv" aria-label="السابقة">→</button><span class="fc-count" id="fn"></span><button class="btn ghost" id="nx" aria-label="التالية">←</button></div>
   <button class="btn" id="toQ">✏️ أنا جاهز للاختبار</button></div>`;
  const fc=document.getElementById("fc");
  const show=()=>{fc.classList.remove("flip");setTimeout(()=>{document.getElementById("fw").textContent=v[k][0];document.getElementById("fb").textContent=v[k][1];},fc.classList.contains("flip")?0:120);document.getElementById("fn").textContent=`${k+1} / ${v.length}`};
  document.getElementById("fw").textContent=v[0][0];document.getElementById("fb").textContent=v[0][1];
  document.getElementById("fn").textContent=`1 / ${v.length}`;
  fc.onclick=()=>fc.classList.toggle("flip");
  document.getElementById("nx").onclick=()=>{k=(k+1)%v.length;show()};
  document.getElementById("pv").onclick=()=>{k=(k-1+v.length)%v.length;show()};
  document.getElementById("toQ").onclick=()=>chapter(i,"quiz");
}

/* ---------- quiz engine ---------- */
function runQuiz(qs,onDone,root){
  let n=0,score=0;const wrong=[];
  const step=()=>{
    const [q,opts,x]=qs[n];const right=opts[0];const sh=opts.length===2?["صح","خطأ"]:shuffle(opts);
    root.innerHTML=`<div class="qbox pop"><div class="qtop"><span>سؤال ${n+1} من ${qs.length}</span><span class="sc">✔ ${score}</span></div>
     <div class="qbar"><i style="width:${n/qs.length*100}%"></i></div>
     <div class="q">${q}</div><div class="opts">${sh.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${LETTERS[j]}</span><span>${o}</span></button>`).join("")}</div>
     <div id="fbk"></div></div>`;
    root.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const pick=sh[+b.dataset.o],ok=pick===right;
      root.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(sh[+o.dataset.o]===right)o.classList.add("right")});
      if(ok)score++;else{b.classList.add("wrong");wrong.push([q,right])}
      const praise=["أحسنت! 🌟","رائع! 🎉","ممتاز يا بطل! 💪","إجابة مستكشف! 🧭","صحيح! 👏"];
      document.getElementById("fbk").innerHTML=`<div class="fb ${ok?'good':'bad'}"><b>${ok?praise[Math.floor(Math.random()*praise.length)]:"لا بأس، تعلّم معي 🙂"}</b>${ok?(x||"إجابتك صحيحة."):"الإجابة الصحيحة: <strong>"+right+"</strong>. "+(x||"")}</div>
       <div class="qnext" style="margin-top:12px"><button class="btn" id="nxq">${n+1<qs.length?"السؤال التالي ←":"النتيجة 🏁"}</button></div>`;
      const nb=document.getElementById("nxq");nb.focus({preventScroll:true});
      nb.onclick=()=>{n++;if(n<qs.length){step();root.scrollIntoView({block:"start"});scrollBy(0,-150)}else onDone(score,wrong)};
    });
  };
  step();
}

function resultCard(score,total,wrong,again,label){
  const p=score/total,st=starsOf(p);
  const t=st===3?["🏆","عبقري صغير!"]:st===2?["🌟","عمل رائع!"]:st===1?["👍","جيد، تستطيع أكثر!"]:["📚","راجع الملخص وحاول مجدداً"];
  if(st>=2)confetti();
  return `<div class="qbox result pop"><div class="big">${t[0]}</div><h3>${t[1]}</h3><div class="rs">${starRow(st)}</div>
   <div class="num">${score} من ${total} إجابة صحيحة</div>
   <div class="row"><button class="btn" id="again">🔁 ${label||"أعد الاختبار"}</button><button class="btn ghost" id="gohome">🏠 الفصول</button></div>
   ${wrong.length?`<div class="review"><h4>راجع هذه الأسئلة:</h4>${wrong.map(w=>`<div class="rv">${w[0]}<br><span class="a">✔ ${w[1]}</span></div>`).join("")}</div>`:""}</div>`;
}

function quizStart(i){
  const root=pane(),all=CH[i].quiz.length;
  root.innerHTML=`<div class="qbox pop" style="text-align:center;align-items:center"><div style="font-size:2.6rem">✏️</div>
   <h3 style="font-size:1.4rem">كم سؤالاً تريد؟</h3><p style="margin:0;color:var(--muted)">في هذا الفصل ${all} سؤالاً. تظهر الأسئلة بترتيب مختلف كل مرة.</p>
   <div class="row"><button class="btn ghost" data-n="10">10 أسئلة</button><button class="btn ghost" data-n="25">25 سؤالاً</button><button class="btn" data-n="${all}">كل الأسئلة (${all})</button></div></div>`;
  root.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>quizRun(i,+b.dataset.n));
}
function quizRun(i,n){
  const root=pane();const qs=shuffle(CH[i].quiz).slice(0,n);
  runQuiz(qs,(score,wrong)=>{
    const st=starsOf(score/qs.length);
    if(st>(best[i]||0)){best[i]=st;save()}
    topBar(home);
    root.innerHTML=resultCard(score,qs.length,wrong);
    document.getElementById("again").onclick=()=>quizStart(i);
    document.getElementById("gohome").onclick=home;
    root.scrollIntoView({block:"start"});scrollBy(0,-150);
  },root);
}

function challenge(){
  topBar(home);app.setAttribute("style","--c:var(--btn);--cs:var(--btn-soft)");
  const pool=[];CH.forEach(c=>c.quiz.forEach(q=>pool.push(q)));
  const qs=shuffle(pool).slice(0,20);
  app.innerHTML=`<section class="hero chal"><span class="em">🏆</span><div><div class="no">من كل الفصول</div><h2>تحدي البطل</h2></div></section><div id="pane"></div>`;
  const root=pane();
  runQuiz(qs,(score,wrong)=>{
    root.innerHTML=resultCard(score,qs.length,wrong,null,"تحدٍّ جديد");
    document.getElementById("again").onclick=challenge;
    document.getElementById("gohome").onclick=home;
  },root);
  scrollTo(0,0);
}

function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const box=document.createElement("div");box.className="confetti";
  const cs=["var(--u1)","var(--u2)","var(--u3)","var(--u4)","var(--u5)","var(--gold)"];
  for(let k=0;k<60;k++){const i=document.createElement("i");i.style.left=Math.random()*100+"%";i.style.background=cs[k%cs.length];i.style.animationDelay=Math.random()*.6+"s";i.style.transform=`rotate(${Math.random()*180}deg)`;box.appendChild(i)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2800);
}

const _home=home;home=function(){app.removeAttribute("style");_home()};
home();
loadStats();
</script>

</body></html>
